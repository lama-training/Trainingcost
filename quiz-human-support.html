<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اختبار الإسناد البشري</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 30px;
        }

        .quiz-container {
            max-width: 800px;
            margin: auto;
        }

        .question {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
        }

        label {
            display: block;
            margin: 12px 0;
        }

        button {
            display: block;
            margin: 25px auto;
            background: #198754;
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        #result {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="quiz-container">

    <h1 style="text-align:center;">اختبار الإسناد البشري للدفاع المدني</h1>

    <div class="question">
        <h3>1. ما المقصود بالإسناد البشري؟</h3>
        <label><input type="radio" name="q1" value="1"> توفير الكوادر والمهارات اللازمة لدعم أعمال الدفاع المدني</label>
        <label><input type="radio" name="q1" value="0"> إدارة المعدات فقط</label>
        <label><input type="radio" name="q1" value="0"> إعداد الجداول الدراسية</label>
    </div>

    <div class="question">
        <h3>2. من أهم مهارات الإسناد البشري:</h3>
        <label><input type="radio" name="q2" value="1"> التنسيق والعمل ضمن فرق الطوارئ</label>
        <label><input type="radio" name="q2" value="0"> العمل الفردي فقط</label>
        <label><input type="radio" name="q2" value="0"> تجاهل التعليمات</label>
    </div>

    <div class="question">
        <h3>3. لماذا يعد التنسيق بين الفرق مهمًا؟</h3>
        <label><input type="radio" name="q3" value="1"> لضمان سرعة وفعالية الاستجابة للطوارئ</label>
        <label><input type="radio" name="q3" value="0"> لتأخير الاستجابة</label>
        <label><input type="radio" name="q3" value="0"> لإلغاء المسؤوليات</label>
    </div>

    <div class="question">
        <h3>4. ماذا يجب على أفراد الفريق أثناء حالات الطوارئ؟</h3>
        <label><input type="radio" name="q4" value="1"> الالتزام بالخطط والتعليمات والتواصل الفعال</label>
        <label><input type="radio" name="q4" value="0"> تجاهل خطة الطوارئ</label>
        <label><input type="radio" name="q4" value="0"> العمل دون تنسيق</label>
    </div>

    <div class="question">
        <h3>5. ما الهدف من تعزيز مهارات الإسناد البشري؟</h3>
        <label><input type="radio" name="q5" value="1"> رفع جاهزية الفرق وتحسين الاستجابة للطوارئ</label>
        <label><input type="radio" name="q5" value="0"> تقليل التعاون بين الفرق</label>
        <label><input type="radio" name="q5" value="0"> إلغاء إجراءات الإسناد</label>
    </div>

    <button onclick="finishQuiz()">إنهاء الاختبار</button>

    <div id="result"></div>

</div>

<script>
function finishQuiz() {
    let score = 0;

    for (let i = 1; i <= 5; i++) {
        const answer = document.querySelector(
            'input[name="q' + i + '"]:checked'
        );

        if (answer && answer.value === "1") {
            score++;
        }
    }

    document.getElementById("result").innerHTML =
        "نتيجتك: " + score + " من 5";
}
</script>

</body>
</html>
