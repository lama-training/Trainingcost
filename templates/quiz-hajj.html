<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>اختبار أعمال السلامة بالحج</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 40px;
        }

        .quiz-container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
        }

        .question {
            display: none;
        }

        .question.active {
            display: block;
        }

        label {
            display: block;
            padding: 15px;
            margin: 10px 0;
            background: #f5f5f5;
            border-radius: 8px;
            cursor: pointer;
        }

        button {
            display: block;
            margin: 25px auto 0;
            padding: 12px 35px;
            background: #006b3c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        #result {
            display: none;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="quiz-container">

    <h1>اختبار أعمال السلامة بالحج</h1>

    <div class="question active">
        <h2>1. ما الهدف من إجراءات السلامة أثناء الحج؟</h2>

        <label>
            <input type="radio" name="q1" value="1">
            زيادة المخاطر
        </label>

        <label>
            <input type="radio" name="q1" value="2">
            حماية الحجاج والعاملين
        </label>

        <label>
            <input type="radio" name="q1" value="3">
            إلغاء التنظيم
        </label>

        <button onclick="nextQuestion()">التالي</button>
    </div>


    <div class="question">
        <h2>2. لماذا يتم تنظيم حركة الحجاج؟</h2>

        <label>
            <input type="radio" name="q2" value="1">
            لزيادة الازدحام
        </label>

        <label>
            <input type="radio" name="q2" value="2">
            للمساعدة على سلامة الحجاج وتقليل المخاطر
        </label>

        <label>
            <input type="radio" name="q2" value="3">
            لمنع الحجاج من الحركة
        </label>

        <button onclick="nextQuestion()">التالي</button>
    </div>


    <div class="question">
        <h2>3. ماذا يجب المحافظة عليه أثناء حالات الطوارئ؟</h2>

        <label>
            <input type="radio" name="q3" value="1">
            إغلاق جميع المخارج
        </label>

        <label>
            <input type="radio" name="q3" value="2">
            مخارج الطوارئ وممرات الإخلاء
        </label>

        <label>
            <input type="radio" name="q3" value="3">
            زيادة الازدحام
        </label>

        <button onclick="nextQuestion()">التالي</button>
    </div>


    <div class="question">
        <h2>4. ما أحد الأمور المهمة للوقاية من الحرائق؟</h2>

        <label>
            <input type="radio" name="q4" value="1">
            تجاهل مصادر الخطر
        </label>

        <label>
            <input type="radio" name="q4" value="2">
            الالتزام بإجراءات الوقاية والسلامة
        </label>

        <label>
            <input type="radio" name="q4" value="3">
            إهمال معدات السلامة
        </label>

        <button onclick="nextQuestion()">التالي</button>
    </div>


    <div class="question">
        <h2>5. كيف نساعد على الوقاية من الإجهاد الحراري؟</h2>

        <label>
            <input type="radio" name="q5" value="1">
            تجاهل ارتفاع الحرارة
        </label>

        <label>
            <input type="radio" name="q5" value="2">
            اتباع إرشادات السلامة والوقاية من الحرارة
        </label>

        <label>
            <input type="radio" name="q5" value="3">
            زيادة المجهود دون توقف
        </label>

        <button onclick="finishQuiz()">إنهاء الاختبار</button>
    </div>


    <div id="result"></div>

</div>


<script>

let currentQuestion = 0;

const questions = document.querySelectorAll(".question");

function nextQuestion() {

    const selected = questions[currentQuestion]
        .querySelector('input[type="radio"]:checked');

    if (!selected) {
        alert("اختاري إجابة أولاً");
        return;
    }

    questions[currentQuestion].classList.remove("active");

    currentQuestion++;

    questions[currentQuestion].classList.add("active");
}


function finishQuiz() {

    const selected = questions[currentQuestion]
        .querySelector('input[type="radio"]:checked');

    if (!selected) {
        alert("اختاري إجابة أولاً");
        return;
    }

    let score = 0;

    for (let i = 1; i <= 5; i++) {

        const answer = document.querySelector(
            'input[name="q' + i + '"]:checked'
        );

        if (answer && answer.value === "2") {
            score++;
        }
    }

    questions[currentQuestion].classList.remove("active");

    const result = document.getElementById("result");

    result.style.display = "block";

    result.innerHTML =
        "نتيجتك: " + score + " من 5";
}

</script>

</body>
</html>
